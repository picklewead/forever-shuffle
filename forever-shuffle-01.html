<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>Forever Shuffle Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style id="app-css">
:root{
  --bg:#EDF0EC;--surface:#FFFFFF;--surface-2:#F4F6F3;--ink:#1B211E;--muted:#5A6660;--line:#D3D9D3;
  --accent:#1F6B5E;--accent-ink:#FFFFFF;--accent-soft:#DCEBE7;
  --good:#23804A;--bad:#B53A33;--warn:#8F6200;--warn-soft:#F6ECD2;
  --q-green:#168708;--q-white:#4A524E;
  --gold:#9C760A;--silver:#66717B;--copper:#9A5226;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1311;--surface:#171C19;--surface-2:#1D2320;--ink:#E4E9E5;--muted:#95A29B;--line:#2B3430;
    --accent:#5CC2AE;--accent-ink:#0C1411;--accent-soft:#1C332D;
    --good:#52C77F;--bad:#EE6E64;--warn:#E3B54E;--warn-soft:#332A14;
    --q-green:#3FDB27;--q-white:#F2F2F2;
    --gold:#E5C04A;--silver:#B8C1C9;--copper:#D4864F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1311;--surface:#171C19;--surface-2:#1D2320;--ink:#E4E9E5;--muted:#95A29B;--line:#2B3430;
  --accent:#5CC2AE;--accent-ink:#0C1411;--accent-soft:#1C332D;
  --good:#52C77F;--bad:#EE6E64;--warn:#E3B54E;--warn-soft:#332A14;
  --q-green:#3FDB27;--q-white:#F2F2F2;
  --gold:#E5C04A;--silver:#B8C1C9;--copper:#D4864F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,34px);letter-spacing:.02em}
h2{font-size:18px;font-weight:700}
h3{font-size:17px;font-weight:700}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num,input.money,input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.dirty{background:var(--warn)}.dot.ro{background:var(--silver)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:6px 12px;font-size:14px;font-weight:600}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.small{padding:3px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:14px;max-width:100%}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:12px}
input.money{width:120px}
input.qty{width:70px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted);padding:10px 14px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pick .name{font-weight:700}
.g{color:var(--gold)}.s{color:var(--silver)}.c{color:var(--copper)}
.coin{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.coin i{font-style:normal;font-size:.8em;margin-right:.25em;opacity:.9}
.coin.pos .sign{color:var(--good)}.coin.neg .sign{color:var(--bad)}
.na{color:var(--muted);font-style:italic;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.rc-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.q-green{color:var(--q-green)}.q-white{color:var(--q-white)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--surface-2)}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.qg{color:var(--q-green)}
.cost{text-align:right;display:flex;flex-direction:column;gap:2px}
.cost .big{font-size:18px}
.miss{font-size:12px;color:var(--warn)}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px}
.out{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2);position:relative}
.out.best{border-color:var(--accent);background:var(--accent-soft)}
.out .pnl{font-size:16px}
.out .sub{font-size:12px;color:var(--muted)}
.pill{position:absolute;top:-9px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px}
.plan{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
details.edit{border-top:1px solid var(--line);padding-top:8px}
details.edit summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.sec{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:3px}
.field .hint{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.how{font-size:12px;color:var(--muted)}
.how.make{color:var(--accent)}
.debtns{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:6px 9px}
.stat b{display:block;font-family:var(--mono);font-size:15px}
.log{display:flex;flex-wrap:wrap;gap:4px;max-height:110px;overflow:auto}
.log span{font-family:var(--mono);font-size:11px;border-radius:5px;padding:1px 5px;background:var(--surface-2);border:1px solid var(--line)}
.log span.e{color:var(--accent);border-color:var(--accent)}
.log span.sh{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.totals .stat b{font-size:18px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.verbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px}
.ver{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px}
.gh{color:var(--accent);font-weight:600;text-decoration:none}
.gh:hover{text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:5}
@media (max-width:560px){.cost{text-align:left}.savebar{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

(function(){

var SEED = JSON.parse(document.getElementById("seed").textContent);

function clone(o){ return JSON.parse(JSON.stringify(o)); }
var S = clone(SEED);

function parseMoney(str){

/* effective cost of a material: cheaper of buying it or crafting it */
function eff(id, seen){

function recipeCost(r){

function matSellValue(id, skipRid){

function deParts(r){

function commit(){

function buildHtml(st){
  var hs = document.head ? document.head.querySelector("style") : null;

function save(){

    try { localStorage.removeItem(KEY); } catch (e) {}

    saving = false;
    var code = err && err.code;
    if (code === "conflict") { toast("Someone saved a newer copy. Reloading to it."); return; }
    if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared") {
      readOnly = true; toast("This copy is view-only for you. Your edits stay in this browser."); return;

function normName(n){ return String(n || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function findMatByName(name){ var k = normName(name); for (var i = 0; i < S.mats.length; i++) if (normName(S.mats[i].name) === k) return S.mats[i]; return null; }
function importPrices(text){
  var res = { updated: [], added: [], noPrice: [], skipped: [] };
  text = String(text || "").trim();
  if (!text) return res;
  function touch(name, price, itemId){
    name = String(name).trim(); if (!name) return;
    var m = findMatByName(name);
    if (!m) { m = { id: uid("m"), name: name, price: 0, kind: "ah", make: null }; S.mats.push(m); res.added.push(name); }
    if (itemId) m.itemId = String(itemId);
    if (price > 0) { m.price = Math.round(price); res.updated.push(m.name); } else res.noPrice.push(m.name);
  }
  if (/^PROFITHUB_/i.test(text)) {
    text.split("^").forEach(function(part){
      var f = part.split(",");
      if (f[0] !== "i" || f.length < 5) return;
      touch(f.slice(4).join(","), Number(f[3]) || 0, f[1]);
    });
    return res;
  }
  var names = S.mats.map(function(m){ return m.name; }).sort(function(a, b){ return b.length - a.length; });
  text.split(/\r?\n/).forEach(function(line){
    line = line.trim(); if (!line) return;
    var low = line.toLowerCase(), hit = null;
    for (var i = 0; i < names.length; i++) if (low.indexOf(names[i].toLowerCase()) !== -1) { hit = names[i]; break; }
    var rest, name;
    if (hit) { name = hit; var at = low.indexOf(hit.toLowerCase()); rest = line.slice(0, at) + " " + line.slice(at + hit.length); }
    else {
      var mm = line.match(/^(.*?)[\s,;|:=\t]+((?:\d+(?:\.\d+)?\s*[gsc]?\s*)+)$/i);
      if (!mm) { res.skipped.push(line); return; }
      name = mm[1]; rest = mm[2];
    }
    rest = rest.replace(/[,;|:=\t"]/g, " ").trim();
    var nums = rest.match(/(\d+(?:\.\d+)?\s*[gsc]\s*)+|\d+(?:\.\d+)?/i);
    var price = nums ? parseMoney(nums[0].trim()) : NaN;
    if (!isFinite(price)) { res.skipped.push(line); return; }
    touch(name, price);
  });
  return res;
}
function importReport(r){
  var parts = [];
  if (r.updated.length) parts.push("Updated " + r.updated.length + ": " + r.updated.join(", ") + ".");
  if (r.added.length) parts.push("New materials added: " + r.added.join(", ") + ".");
  if (r.noPrice.length) parts.push("No price in the paste for: " + r.noPrice.join(", ") + ". Type those in below.");
  if (r.skipped.length) parts.push("Couldn't read " + r.skipped.length + " line" + (r.skipped.length === 1 ? "" : "s") + ": " + r.skipped.slice(0, 5).join(" / ") + ".");
  return parts.length ? parts.join(" ") : "Nothing found to import.";
}

}
function shopTab(){
  var buy = {}, craft = {}, plans = [], spend = 0, ret = 0, missing = {};
  function expand(id, qty, seen){
    var m = mat(id), e = eff(id, seen);
    if (!m) return;
    if (e.how === "make") {
      var s2 = Object.assign({}, seen); s2[id] = 1;
      craft[id] = (craft[id] || 0) + qty;
      expand(m.make.from, qty / (m.make.yields || 1) * m.make.qty, s2);
    } else { buy[id] = (buy[id] || 0) + qty; if (e.how == null) missing[m.name] = 1; }
  }
  S.recipes.forEach(function(r){
    var q = Number(r.plan) || 0; if (!q) return;
    var o = outcomes(r);
    plans.push({ r: r, q: q, o: o });
    r.reagents.forEach(function(g){ expand(g.mat, g.qty * q, {}); });
    if (o.best) ret += (o[o.best.key] + o.cost) * q;
  });
  if (!plans.length) return '<div class="panel"><h2>Nothing planned yet</h2><p class="note">Set "Plan to make" on any item in the Shuffle tab and your shopping list builds here.</p></div>';
  var h = '<div class="panel"><h2>Your plan</h2><div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Make</th><th>Best route</th><th class="r">Mats</th><th class="r">Profit / loss</th></tr></thead><tbody>';
  var net = 0;
  plans.forEach(function(p){
    var v = p.o.best ? p.o[p.o.best.key] * p.q : null; if (v != null && isFinite(v)) net += v;
    h += '<tr><td class="q-' + p.r.quality + '">' + esc(p.r.name) + '</td><td class="r num">' + p.q + '</td><td>' + (p.o.best ? esc(p.o.best.label) : '<span class="na">no sell price yet</span>') + '</td><td class="r">' + money(p.o.cost * p.q) + '</td><td class="r">' + money(v, { sign: true }) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  var crafts = Object.keys(craft);
  if (crafts.length) {
    h += '<div class="panel"><h2>Craft these first</h2><div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Need</th><th>From</th></tr></thead><tbody>';
    crafts.forEach(function(id){ var m = mat(id), f = mat(m.make.from), n = Math.ceil(craft[id] / (m.make.yields || 1)); h += '<tr><td>' + esc(m.name) + '</td><td class="r num">' + Math.ceil(craft[id]) + '</td><td>' + n + ' craft' + (n === 1 ? "" : "s") + ' using ' + Math.ceil(n * m.make.qty) + ' ' + esc(f ? f.name : "?") + '</td></tr>'; });
    h += '</tbody></table></div></div>';
  }
  h += '<div class="panel"><h2>Buy these</h2><div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Where</th><th class="r">Qty</th><th class="r">Each</th><th class="r">Total</th></tr></thead><tbody>';
  Object.keys(buy).sort(function(a, b){ return (mat(a).kind > mat(b).kind) ? 1 : -1; }).forEach(function(id){
    var m = mat(id), n = Math.ceil(buy[id] - 1e-9), each = m.price > 0 ? m.price : NaN, tot = each * n;
    if (isFinite(tot)) spend += tot;
    h += '<tr><td>' + esc(m.name) + '</td><td>' + (m.kind === "vendor" ? "Vendor" : "Auction house") + '</td><td class="r num">' + n + '</td><td class="r">' + money(each) + '</td><td class="r">' + money(tot) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  if (Object.keys(missing).length) h += '<p class="miss">Missing prices: ' + esc(Object.keys(missing).join(", ")) + '. Totals leave these out.</p>';
  h += '<div class="totals"><div class="stat"><span class="lbl">Shopping total</span><b>' + money(spend) + '</b></div><div class="stat"><span class="lbl">Coming back (best routes)</span><b>' + money(ret) + '</b></div><div class="stat"><span class="lbl">Net on the plan</span><b>' + money(net, { sign: true }) + '</b></div></div></div>';
  return h;
}
function render(){
  var app = document.getElementById("app");
  var act = document.activeElement, aid = act && act.id ? act.id : null;
  var tabs = [["shuffle", "Shuffle"], ["prices", "Prices"], ["shop", "Shopping list"]];
  var h = '<div class="wrap"><div class="verbar"><span class="ver">Alpha v' + APP_VERSION + '</span><a class="gh" href="' + REPO_URL + '" target="_blank" rel="noopener">View on GitHub</a></div><header class="top"><div><h1>Forever Shuffle</h1><p>Tailoring and enchanting on WoW Forever: craft to disenchant, turn the essence into wands, and see which way to cash out. Every price is yours to change.</p></div>' + saveBar() + '</header>';
  h += bestStrip();
  h += '<nav class="tabs" role="tablist">' + tabs.map(function(t){ return '<button role="tab" aria-selected="' + (ui.tab === t[0]) + '" data-act="tab" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join("") + '</nav>';
  h += '<main>' + (ui.tab === "prices" ? pricesTab() : ui.tab === "shop" ? shopTab() : shuffleTab()) + '</main></div>';
  if (ui.toast) h += '<div class="toast" role="status">' + esc(ui.toast) + '</div>';
  var io = document.getElementById("io"), ioVal = io ? io.value : ""; var ppEl = document.getElementById("pp"), ppVal = ppEl ? ppEl.value : "";
  app.innerHTML = h;
  var io2 = document.getElementById("io"); if (io2 && ioVal) io2.value = ioVal; var pp2 = document.getElementById("pp"); if (pp2 && ppVal) pp2.value = ppVal;
  if (aid) { var el = document.getElementById(aid); if (el && el.focus) el.focus({ preventScroll: true }); }
}

/* ---------- events ---------- */
function findR(id){ for (var i = 0; i < S.recipes.length; i++) if (S.recipes[i].id === id) return S.recipes[i]; return null; }
document.addEventListener("change", function(ev){
  var t = ev.target, k = t.getAttribute && t.getAttribute("data-k"); if (!k) return;
  var f = t.getAttribute("data-f");
  var val = t.type === "checkbox" ? t.checked : t.value;
  if (t.getAttribute("data-money")) { val = parseMoney(val); if (!isFinite(val)) { toast("Try copper (255) or coins like 2s 55c."); render(); return; } }
  if (k === "ui") { ui[f] = val; render(); return; }
  if (k === "set") { S.settings[f] = f === "ahCut" ? (Number(val) || 0) : val; return commit(); }
  if (k === "r") { var r = findR(t.getAttribute("data-rid")); if (!r) return; r[f] = f === "plan" ? Math.max(0, Math.floor(Number(val) || 0)) : val; return commit(); }
  if (k === "rg") { var r2 = findR(t.getAttribute("data-rid")), g = r2 && r2.reagents[+t.getAttribute("data-i")]; if (!g) return; g[f] = f === "qty" ? Math.max(0, Number(val) || 0) : val; return commit(); }
  if (k === "de") { var r3 = findR(t.getAttribute("data-rid")); if (!r3) return; r3.de[f] = val; return commit(); }
  if (k === "m") {
    var m = mat(t.getAttribute("data-mid")); if (!m) return;
    if (f === "makeFrom") { if (!val) m.make = null; else { m.make = m.make || { qty: 1, yields: 1 }; m.make.from = val; } }
    else if (f === "makeQty" || f === "makeYields") { if (!m.make) { toast("Pick what it's crafted from first."); render(); return; } m.make[f === "makeQty" ? "qty" : "yields"] = Math.max(f === "makeYields" ? 1 : 0, Number(val) || (f === "makeYields" ? 1 : 0)); }
    else m[f] = val;
    return commit();
  }
});
document.addEventListener("toggle", function(ev){
  var d = ev.target; if (!d || !d.getAttribute || d.tagName !== "DETAILS") return;
  var id = d.getAttribute("data-rid"); if (id) ui.open[id] = d.open;
}, true);
document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-act]") : null; if (!b) return;
  var a = b.getAttribute("data-act"), rid = b.getAttribute("data-rid"), r = rid ? findR(rid) : null;
  switch (a) {
    case "tab": ui.tab = b.getAttribute("data-t"); ui.confirm = null; ui.importMsg = ""; try { localStorage.setItem("wf-tab", ui.tab); } catch (e) {} render(); break;
    case "save": save(); break;
    case "discard": S = clone(SEED); commit(); toast("Back to the starting prices."); break;
    case "ask": ui.confirm = b.getAttribute("data-c"); render(); break;
    case "cancel": ui.confirm = null; render(); break;
    case "add-r":
      var nr = { id: uid("r"), name: "New item", prof: ui.filter === "Enchanting" ? "Enchanting" : "Tailoring", skill: "", quality: "green", verify: false, canDE: true, notes: "", reagents: [{ mat: S.mats[0].id, qty: 1 }], vendor: 0, ahSell: 0, ahBuy: 0, plan: 0, de: { dust: "strangeDust", ess: "lme", shard: "sgs", log: [] } };
      S.recipes.unshift(nr); ui.open[nr.id] = true; commit();
      setTimeout(function(){ var el = document.getElementById("nm-" + nr.id); if (el) { el.focus(); el.select(); } }, 0);
      break;
    case "del-r": S.recipes = S.recipes.filter(function(x){ return x.id !== rid; }); ui.confirm = null; commit(); break;
    case "add-rg": if (r) { r.reagents.push({ mat: S.mats[0].id, qty: 1 }); commit(); } break;
    case "del-rg": if (r) { r.reagents.splice(+b.getAttribute("data-i"), 1); commit(); } break;
    case "de-add": if (r) { r.de.log.push(b.getAttribute("data-v").split(",").map(Number)); commit(); } break;
    case "de-undo": if (r) { r.de.log.pop(); commit(); } break;
    case "de-clear": if (r) { r.de.log = []; ui.confirm = null; commit(); } break;
    case "add-m": S.mats.push({ id: uid("m"), name: "New material", price: 0, kind: "ah", make: null }); commit(); break;
    case "del-m":
      var mid = b.getAttribute("data-mid");
      var inUse = S.recipes.some(function(x){ return x.reagents.some(function(g){ return g.mat === mid; }); }) || S.mats.some(function(x){ return x.make && x.make.from === mid; });
      if (inUse) { ui.confirm = null; toast("That material is still used in a recipe. Swap it out first."); break; }
      S.mats = S.mats.filter(function(x){ return x.id !== mid; }); ui.confirm = null; commit(); break;
    case "copy":
      var txt = JSON.stringify(S), io = document.getElementById("io");
      var fallback = function(){ if (io) { io.value = txt; io.select(); } toast("Data is in the box below. Copy it from there."); };
      try { navigator.clipboard.writeText(txt).then(function(){ toast("Copied. Paste it anywhere to share."); }, fallback); } catch (e) { fallback(); }
      break;
    case "paste-prices":
      var pp = document.getElementById("pp");
      var rep = importPrices(pp ? pp.value : "");
      ui.importMsg = importReport(rep);
      if (pp && (rep.updated.length || rep.added.length)) pp.value = "";
      commit();
      break;
    case "import":
      var box = document.getElementById("io");
      try {
        var nd = JSON.parse(box.value);
        if (!nd || !Array.isArray(nd.mats) || !Array.isArray(nd.recipes)) throw 0;
        nd.rev = SEED.rev; nd.savedAt = SEED.savedAt; nd.settings = nd.settings || { ahCut: 5, deCut: true };
        nd.recipes.forEach(function(x){ x.quality = "green"; }); S = nd; box.value = ""; commit(); toast("Loaded. It stays in this browser.");
      } catch (e) { toast("That doesn't look like ledger data. Copy it again and paste the whole thing."); }
      break;
  }
});

/* tell a parent page (an embed) how tall the ledger is, so the iframe can fit it with no scrollbar */
var lastH = 0;
function postHeight(){
  if (window.parent === window) return;
  var h = Math.ceil(document.body.getBoundingClientRect().height);
  if (h && Math.abs(h - lastH) > 2) { lastH = h; try { window.parent.postMessage({ type: "forever-shuffle-height", height: h }, "*"); } catch (e) {} }
}
if (window.ResizeObserver) { try { new ResizeObserver(postHeight).observe(document.body); } catch (e) {} }
window.addEventListener("load", postHeight);
document.addEventListener("toggle", function(){ setTimeout(postHeight, 0); }, true);

render();
initCaps();
setTimeout(postHeight, 50);
})();
</script>
